# Blank issues stay on. The two forms above cover the reports this project can
# act on, and a form that refuses everything else turns "your list is wrong in a
# way you did not anticipate" into no report at all.
blank_issues_enabled: true
contact_links:
  - name: How a correction is applied
    url: https://github.com/xyzs996/free-llm-api/blob/main/CONTRIBUTING.md
    about: Which file holds the number, what has to change alongside it, and which files are generated.
  - name: Report a credential that leaked into this repository
    url: https://github.com/xyzs996/free-llm-api/blob/main/SECURITY.md
    about: Do not open a public issue for this one.
  - name: Where the price figures come from
    url: https://xyzs996.github.io/ai-coding-field-notes/figures.html
    about: Every figure cited in the field notes, each row carrying the sentence it was published in.
